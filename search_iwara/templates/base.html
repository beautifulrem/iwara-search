<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Search Iwara{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=emoji_events,favorite,fiber_new,trending_up" rel="stylesheet">
  <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">
  <script defer src="{{ request.url_for('static', path='app.js') }}"></script>
</head>
<body>
  <div class="page-backdrop"></div>
  <header class="site-header">
    <div class="site-header__inner">
      <div>
        <a class="site-title" href="/">Search Iwara</a>
        <p class="site-subtitle">Oreno3D metadata mirror for local search and filtering.</p>
      </div>
      <nav class="site-nav">
        <a href="/">搜索</a>
        <a href="/characters">角色</a>
        <a href="/authors">作者</a>
        <a href="/tags">标签</a>
        <a href="/origins">原作</a>
      </nav>
    </div>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
