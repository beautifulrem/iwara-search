name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"

# Third-party actions are pinned to commit SHAs (tag in the trailing comment);
# Dependabot's github-actions ecosystem keeps both up to date.

jobs:
  prepare:
    name: Verify tag & build Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify version parity & extract release notes
        id: meta
        env:
          RAW_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW_REF#refs/tags/}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          IMAGE="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          python3 scripts/release.py notes "${TAG}" --repo "${GITHUB_REPOSITORY}" --output release-notes.md
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "image=${IMAGE}"
          } >> "${GITHUB_OUTPUT}"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not slow and not e2e" -n auto

      - name: Audit locked runtime dependencies
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > requirements.txt
          uvx --python 3.13 --from pip-audit==2.10.1 \
            pip-audit --strict --disable-pip --no-deps --requirement requirements.txt

      - name: Build wheel, sdist, and SHA256SUMS
        run: |
          uv build --out-dir dist
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)

      - name: Attest Python distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  docker-build:
    name: Container image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish multi-arch GHCR manifest
    needs: [prepare, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.tag }}

      - name: Create and push multi-arch manifest list
        id: merge
        env:
          IMAGE_NAME: ${{ needs.prepare.outputs.image }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && args+=(-t "${tag}")
          done <<< "${TAGS}"
          args+=(
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --annotation "index:org.opencontainers.image.version=${IMAGE_VERSION}"
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only"
          )
          sources=()
          for file in *; do
            sources+=("${IMAGE_NAME}@sha256:${file}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          manifest_digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${manifest_digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_VERSION}"

      - name: Smoke-test published GHCR image
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name si-release -p 8000:8000 "${IMAGE_REF}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              docker rm -f si-release
              exit 0
            fi
            sleep 1
          done
          docker logs si-release
          docker rm -f si-release
          exit 1

      - name: Attest multi-arch container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub Release
    needs: [prepare, docker-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Search Iwara ${{ needs.prepare.outputs.version }}
          body_path: notes/release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'false' && 'true' || 'false' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
