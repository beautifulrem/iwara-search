[project]
name = "search-iwara"
version = "0.2.1"
description = "Local Oreno3D metadata mirror with SQLite search and a FastAPI UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx[http2,socks]>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "platformdirs>=4.2,<5.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "rich>=13.9,<15.0",
  "selectolax>=0.3,<1.0",
  "typer>=0.16,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
search-iwara = "search_iwara.cli:main"

[project.urls]
Repository = "https://github.com/beautifulrem/iwara-search"

[dependency-groups]
dev = [
  "httpx2>=2.13",  # starlette.testclient's HTTP client (the runtime crawler uses httpx)
  "hypothesis>=6.120",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]
e2e = [
  "axe-playwright-python>=0.1.4",
  "pytest-playwright>=0.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "error",
  # uvicorn still imports websockets' legacy API (third-party, harmless for us)
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.protocols.websockets.*",
]
markers = [
  "slow: large synthetic-dataset performance budgets (deselect with -m 'not slow')",
  "e2e: browser end-to-end tests (requires the e2e dependency group and playwright browsers)",
]

[tool.coverage.run]
source = ["search_iwara"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PL", "S", "ASYNC", "PERF"]
ignore = [
  "PLR0913",  # keyword-only option bundles are intentional in CLI/service entry points
  "PLR2004",  # magic values in tests and small numeric thresholds
  "S101",     # assert is used by pytest
  "S608",     # SQL is assembled only from whitelisted identifiers; values are bound parameters
]
allowed-confusables = ["，", "｜", "–", "、"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "E501", "RUF001", "RUF003", "PLC0415"]  # CJK/HTML fixtures, local imports
"search_iwara/cli.py" = ["PLR0917"]  # Typer maps parameters to CLI options


[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.isort]
known-first-party = ["search_iwara"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["search_iwara", "deploy/linux/search_iwara_deploy", "deploy/linux/manage.py"]
mypy_path = "deploy/linux"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["search_iwara*"]
exclude = ["data*", "docs*", "tests*"]

[tool.setuptools.package-data]
search_iwara = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*", "locales/*.toml", "py.typed"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"
